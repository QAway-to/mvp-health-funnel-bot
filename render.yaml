# Один сервис на два продукта: он же принимает вебхук Telegram, он же отдаёт
# лендинги. Раньше это были два сервиса в двух репозиториях, а на Render тариф
# привязан к сервису — значит два счёта и два засыпающих контейнера.
#
# План здесь оставлен free намеренно: сменить его на Starter нужно в панели,
# осознанно и один раз. На платном тарифе контейнер не засыпает, и пропадает
# главная беда free — человек пишет боту первым сообщением и ждёт ответа
# 30–50 секунд, пока тот просыпается.
#
# healthCheckPath именно /health, а не /: корень теперь отдаёт главную сайта.

services:
  - type: web
    name: health-funnel-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: CONTENT_CHANNEL_ID
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: FUNNEL_CTA_AT
        sync: false
      - key: PURCHASE_URL
        sync: false
      - key: PAYMENTS_ENABLED
        sync: false
      - key: STARS_PRICE
        sync: false
      - key: SHEETS_SCRIPT_URL
        sync: false
      - key: SHEETS_SECRET
        sync: false
      - key: TASKS_SECRET
        sync: false
      # Задан — состояние воронки живёт в Postgres, пусто — в Google Sheets.
      - key: DATABASE_URL
        sync: false
      # Базовый адрес сайта для canonical и OG-тегов. Нужен на этапе сборки
      # статики внутри образа, а не в рантайме.
      - key: PUBLIC_SITE_URL
        sync: false

  # Будильник для догоняющих сообщений. Планировщик внутри веб-сервиса не
  # годится: контейнер на free-плане засыпает, и его таймер вместе с ним.
  # Раз в час достаточно — самый ранний шаг цепочки ждёт час тишины.
  - type: cron
    name: health-funnel-followups
    runtime: docker
    plan: free
    schedule: "0 * * * *"
    dockerCommand: >-
      sh -c 'curl -fsS -X POST -H "X-Tasks-Secret: $TASKS_SECRET" "$BOT_URL/tasks/followups"'
    envVars:
      - key: TASKS_SECRET
        sync: false
      - key: BOT_URL
        sync: false
